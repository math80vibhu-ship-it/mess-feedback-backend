version: '3.8'

services:
  backend1:
    build:
      context: .
      dockerfile: Dockerfile
    image: mess-backend:hardened
    container_name: mess_backend_1
    restart: unless-stopped
    environment:
      - PORT=5000
      - INSTANCE_ID=backend-instance-1
      - MONGO_URI=mongodb+srv://math80vibhu_db_user:kzVnX3soTkgaUqwz@cluster0.tukfqik.mongodb.net/messfeedback?retryWrites=true&w=majority&appName=Cluster0
      - JWT_SECRET=messhub_super_secret_jwt_key_2026
    ports:
      - "5001:5000"

  backend2:
    build:
      context: .
      dockerfile: Dockerfile
    image: mess-backend:hardened
    container_name: mess_backend_2
    restart: unless-stopped
    environment:
      - PORT=5000
      - INSTANCE_ID=backend-instance-2
      - MONGO_URI=mongodb+srv://math80vibhu_db_user:kzVnX3soTkgaUqwz@cluster0.tukfqik.mongodb.net/messfeedback?retryWrites=true&w=majority&appName=Cluster0
      - JWT_SECRET=messhub_super_secret_jwt_key_2026
    ports:
      - "5002:5000"

  backend3:
    build:
      context: .
      dockerfile: Dockerfile
    image: mess-backend:hardened
    container_name: mess_backend_3
    restart: unless-stopped
    environment:
      - PORT=5000
      - INSTANCE_ID=backend-instance-3
      - MONGO_URI=mongodb+srv://math80vibhu_db_user:kzVnX3soTkgaUqwz@cluster0.tukfqik.mongodb.net/messfeedback?retryWrites=true&w=majority&appName=Cluster0
      - JWT_SECRET=messhub_super_secret_jwt_key_2026
    ports:
      - "5003:5000"

  nginx:
    image: nginx:alpine
    container_name: mess_nginx_lb
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2
      - backend3
