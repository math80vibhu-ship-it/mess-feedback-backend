events {
    worker_connections 1024;
}

http {
    # High-Availability Resilient Upstream Pool with fail detection (Question 1c After)
    upstream mess_backend_cluster {
        server backend1:5000 max_fails=2 fail_timeout=5s;
        server backend2:5000 max_fails=2 fail_timeout=5s;
        server backend3:5000 max_fails=2 fail_timeout=5s;
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://mess_backend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # High-Availability Zero-Downtime Failover Directives (Question 1c After):
            # Automatically retry failed requests on next healthy upstream server
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 5s;

            # Fast connection failure detection (1s connect timeout)
            proxy_connect_timeout 1s;
            proxy_read_timeout 3s;
            proxy_send_timeout 3s;
        }
    }
}
